name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        script: |
          # 1. 가짜 폴더(Git 아님)가 있으면 삭제
          if [ -d "news-bot" ] && [ ! -d "news-bot/.git" ]; then
            rm -rf news-bot
          fi

          # 2. 폴더가 없으면 새로 받기 (Git Clone)
          if [ ! -d "news-bot" ]; then
            git clone https://github.com/konan-jpg/public-news-bot.git news-bot
          fi
          
          cd news-bot

          # 3. 강제 업데이트
          git fetch --all
          git reset --hard origin/main

          # 4. 라이브러리 설치 & 재시작
          pip3 install -r requirements.txt
          pkill -f bot.py || true
          nohup python3 bot.py > bot.log 2>&1 &
