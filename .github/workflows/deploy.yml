name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        command_timeout: 60s
        script: |
          if [ -d "news-bot" ] && [ ! -d "news-bot/.git" ]; then
            rm -rf news-bot
          fi
          if [ ! -d "news-bot" ]; then
            git clone https://github.com/konan-jpg/public-news-bot.git news-bot
          fi
          cd news-bot
          git fetch --all
          git reset --hard origin/main
          pip3 install -r requirements.txt
          pkill -f "python3 bot.py" || true
          sleep 1
          nohup python3 bot.py < /dev/null > bot.log 2>&1 &
          sleep 2
          echo "done"
          exit 0
