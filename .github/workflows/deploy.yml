name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        command_timeout: 60s
        script: |
          # 1. 폴더 준비
          if [ -d "news-bot" ] && [ ! -d "news-bot/.git" ]; then
            rm -rf news-bot
          fi
          if [ ! -d "news-bot" ]; then
            git clone https://github.com/konan-jpg/public-news-bot.git news-bot
          fi
          cd news-bot

          # 2. 최신 코드 받기
          git fetch --all
          git reset --hard origin/main

          # 3. 라이브러리 설치
          pip3 install -r requirements.txt

          # 4. 기존 봇 종료
          pkill -f "python3 bot.py" || true
          sleep 1

          # 5. 봇 재시작 (SSH와 완전 분리)
          setsid nohup python3 bot.py > bot.log 2>&1 &
          disown
          sleep 2
          echo "배포 완료"
